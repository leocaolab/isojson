name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
        env:
          PYO3_PYTHON: python
      - run: cargo clippy --tests -- -D warnings
        env:
          PYO3_PYTHON: python
      # The pure core (datetime.rs, decline.rs) is unit-tested without an
      # interpreter; the test binary still links libpython, so point the
      # loader at setup-python's copy.
      - name: cargo test --lib
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          cargo test --lib
        env:
          PYO3_PYTHON: python

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['test']))")
          maturin build --release --out dist -i python
          python -m pip install --no-index --find-links dist isojson
      - name: Tests
        run: python -m pytest tests -q
      - name: Tests under the CPython debug allocator
        run: python -m pytest tests -q -p no:cacheprovider
        env:
          PYTHONMALLOC: debug

  # A debug build: the FR-13 `debug_assert!(self.guard)` sites and Rust's
  # debug checks run under the whole suite.
  test-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install the debug wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['test']))")
          maturin build --out dist -i python
          python -m pip install --no-index --find-links dist isojson
      - name: Tests (debug build)
        run: python -m pytest tests -q

  # Non-blocking: the suite against the latest orjson, so an orjson release
  # that fixes a §1b row or changes its output shows up here.
  test-latest-orjson:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install the wheel, latest orjson
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['test']))")
          python -m pip install --upgrade orjson
          maturin build --release --out dist -i python
          python -m pip install --no-index --find-links dist isojson
          python -c "import orjson; print('orjson', orjson.__version__)"
      - name: Tests
        run: python -m pytest tests -q
        env:
          ISOJSON_ORJSON_ANY: "1"
