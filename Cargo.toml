[package]
name = "isojson"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Fast JSON for CPython that is safe in per-interpreter-GIL sub-interpreters (PEP 684)"
license = "Apache-2.0"
repository = "https://github.com/leocaolab/isojson"
publish = false

[lib]
name = "isojson"
crate-type = ["cdylib"]

[dependencies]
pyo3-ffi = "0.29"
itoa = "1"
zmij = "1.0.23"
simd-json = { version = "0.18", default-features = false, features = ["runtime-detection", "swar-number-parsing", "big-int-as-float"] }

[build-dependencies]
pyo3-build-config = "0.29"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# simd-json 0.18.1 with the lone-high-surrogate fix (upstream PR pending):
# "\ud800" parsed as "\0" instead of an error. Pinned by commit; drop this
# once a simd-json release contains the fix.
[patch.crates-io]
simd-json = { git = "https://github.com/leocaolab/simd-json", rev = "0e253fb" }
