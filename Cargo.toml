[package]
name = "isojson"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Fast JSON for CPython that is safe in per-interpreter-GIL sub-interpreters (PEP 684)"
license = "Apache-2.0"
repository = "https://github.com/leocaolab/isojson"
publish = false

[lib]
name = "isojson"
crate-type = ["cdylib"]

[dependencies]
pyo3-ffi = "0.29"
itoa = "1"
zmij = "1.0.23"
fast-float2 = "0.2.4"

[build-dependencies]
pyo3-build-config = "0.29"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
