[package]
name = "isojson"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Fast JSON for CPython that is safe in per-interpreter-GIL sub-interpreters (PEP 684)"
license = "Apache-2.0"
repository = "https://github.com/leocaolab/isojson"
publish = false

[lib]
name = "isojson"
crate-type = ["cdylib"]

[dependencies]
pyo3-ffi = "0.29"
itoa = "1"
zmij = "1.0.23"
simd-json = { version = "0.19", default-features = false, features = ["runtime-detection", "swar-number-parsing", "big-int-as-float"] }

[build-dependencies]
pyo3-build-config = "0.29"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
