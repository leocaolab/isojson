[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "isojson"
description = "Fast JSON for CPython that is safe in per-interpreter-GIL sub-interpreters (PEP 684)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "orjson==3.12.0", "numpy>=2", "pytz", "tzdata"]

[project.urls]
Repository = "https://github.com/leocaolab/isojson"

[tool.maturin]
python-source = "python"
module-name = "isojson.isojson"
